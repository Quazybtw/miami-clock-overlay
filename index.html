
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miami Stream Clock</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
#clock{display:inline-flex;align-items:center;gap:9px;margin:8px;padding:9px 13px;background:rgba(10,15,25,.62);border:1px solid rgba(255,255,255,.16);border-radius:9px;color:#fff;font-size:19px;font-weight:700;letter-spacing:.35px;text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;font-variant-numeric:tabular-nums}
#dot{width:7px;height:7px;background:#62e6a8;border-radius:50%;box-shadow:0 0 6px #62e6a8}
#zone{color:#b9c4d5;font-size:15px}
</style>
</head>
<body><div id="clock"><span id="dot"></span><span id="date"></span><span id="time"></span><span id="zone"></span></div>
<script>
const zone='America/New_York';
const dateFmt=new Intl.DateTimeFormat('en-US',{timeZone:zone,weekday:'short',month:'short',day:'2-digit',year:'numeric'});
const timeFmt=new Intl.DateTimeFormat('en-US',{timeZone:zone,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
const zoneFmt=new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'short'});
function tick(){const now=new Date();document.getElementById('date').textContent=dateFmt.format(now).toUpperCase()+'  •';document.getElementById('time').textContent=timeFmt.format(now);document.getElementById('zone').textContent=zoneFmt.formatToParts(now).find(x=>x.type==='timeZoneName')?.value||'ET'}
tick();setInterval(tick,1000);
</script></body></html>
